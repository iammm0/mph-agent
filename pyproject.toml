[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mph-agent"
version = "1.1.2"
description = "面向 COMSOL Multiphysics 的多物理场仿真建模智能体（桌面端 / 源码运行；不提供 pip 发布包）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "mph-agent contributors"}
]
keywords = ["comsol", "agent", "nlp", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "openai>=1.0.0",
    "litellm>=1.60.0",
    "requests>=2.28.0",
    "jpype1>=1.4.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "tqdm>=4.66.0",
    "setuptools>=61.0",
    "questionary>=1.10.0",
    "sqlite-vec>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
# 向量检索：安装后可使用 skills 的语义检索（否则仅关键词/trigger 匹配）
vec = [
    "sentence-transformers>=2.2.0",
]
# 可选：MPh（https://github.com/MPh-py/MPh）用于参数/求值/导出等后处理。
# 注意：`uv sync` / `uv sync --extra dev` 默认不会装 MPh，且可能卸掉已装的 mph；
# 需要后处理时请用：`uv sync --extra mph` 或 `uv sync --extra "dev,mph"`。
mph = [
    "MPh>=1.2.0",
]
# 记忆模块已内置：Python 原生异步 + 本地 SQLite/文件，无需额外依赖

# 本地/源码可编辑安装用（不对外发 pip 包）。日常请用桌面端或 `uv run python cli.py`。

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
agent = ["*.txt", "*.md", "prompts/**/*.txt", "skills/library/**/*.md"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
