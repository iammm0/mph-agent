# Tauri 桌面端：构建并发布（手动或 release 分支）
# 目标平台：Windows x64（AMD64）与 macOS Apple Silicon（arm64）
name: Build and Release Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: windows-x64
            args: '--bundles nsis'
          - platform: macos-latest
            artifact: macos-arm64
            args: '--bundles dmg'
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python deps
        run: uv sync

      # 统一解析版本与发布 tag：tag 触发用 tag 版本，否则用 tauri 配置中的版本（用 bash + node 避免 Windows PowerShell 解析 JS）
      - name: Resolve version and release tag
        id: version
        shell: bash
        run: |
          node -e "
          const ref = process.env.GITHUB_REF || '';
          const refName = process.env.GITHUB_REF_NAME || '';
          const fs = require('fs');
          const path = require('path');
          let version, releaseTag;
          if (ref.startsWith('refs/tags/') && refName.startsWith('desktop-v')) {
            version = refName.replace(/^desktop-v/, '');
            releaseTag = refName;
          } else {
            const confPath = path.join('desktop', 'src-tauri', 'tauri.conf.json');
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            version = conf.version;
            releaseTag = 'desktop-v' + version;
          }
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, 'version=' + version + '\nrelease_tag=' + releaseTag + '\n');
          "
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Sync version to project (when triggered by tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const v = process.env.VERSION;
          const confPath = path.join('desktop', 'src-tauri', 'tauri.conf.json');
          const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
          conf.version = v;
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2));
          const cargoPath = path.join('desktop', 'src-tauri', 'Cargo.toml');
          let cargo = fs.readFileSync(cargoPath, 'utf8');
          cargo = cargo.replace(/^version = \".*\"/m, 'version = \"' + v + '\"');
          fs.writeFileSync(cargoPath, cargo);
          const pkgPath = path.join('desktop', 'package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = v;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2));
          "
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop

      - name: Build Python bridge (Windows)
        if: runner.os == 'Windows'
        run: .\desktop\scripts\build-bridge.ps1

      - name: Build Python bridge (macOS)
        if: runner.os == 'macOS'
        run: bash desktop/scripts/build-bridge.sh

      - name: Download bundled JDK 11 (Windows x64)
        if: runner.os == 'Windows'
        run: .\scripts\download-jdk11.ps1
        working-directory: desktop

      - name: Download bundled JDK 11 (macOS Apple Silicon)
        if: runner.os == 'macOS'
        run: bash scripts/download-jdk11.sh
        working-directory: desktop

      - name: Build and release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ steps.version.outputs.release_tag }}
          releaseName: Multiphysics Modeling Agent Desktop v${{ steps.version.outputs.version }}
          releaseBody: |
            Windows x64（AMD64）与 macOS Apple Silicon 安装包（含内嵌 Java 11）。
            See the assets below to download and install.
          releaseDraft: true
          prerelease: false
          appVersion: ${{ steps.version.outputs.version }}
          args: ${{ matrix.args }}
